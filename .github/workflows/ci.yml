name: CI

# T064: prepared locally. Review and commit this workflow deliberately before
# enabling it on GitHub. It uses placeholder, non-production credentials for an
# ephemeral CI database only; no repository secret is required to run it.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-not-a-real-password
          POSTGRES_DB: js_jewellers_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d js_jewellers_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://ci:ci-not-a-real-password@localhost:5432/js_jewellers_ci
      NEXT_PUBLIC_SITE_URL: https://ci.invalid
      CHECKOUT_DRAFT_SECRET: ci-only-checkout-secret-not-used-in-production
      # CI-only values. They exist to compile and boot the app, never to serve
      # real traffic. Production validation rejects placeholders separately.
      BLOB_READ_WRITE_TOKEN: ci-only-blob-token-value
      ADMIN_MFA_ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      RATE_LIMIT_PROVIDER: memory
      RATE_LIMIT_ALLOW_MEMORY_IN_PRODUCTION: "true"
      LOG_LEVEL: warn

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Apply migrations to the CI database
        run: npm run prisma:deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and security tests
        run: npm test

      - name: Contrast and accessibility token checks
        run: npm run check:contrast

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
